<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>關於我們｜柚香園</title>
	<meta name="description" content="認識柚香園：三代傳承的家族柚子果園。">
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- ===== 導覽列：內容由 main.js 產生，要修改請改 main.js ===== -->
	<header class="site-header" id="site-header"></header>

	<main>
		<!-- ===== 頁面標題 ===== -->
		<div class="page-banner">
			<div class="container">
				<h1>關於柚香園</h1>
				<p>三代人守護的一片柚子林</p>
			</div>
		</div>

		<!-- ===== 果園故事 ===== -->
		<section id="about">
			<div class="container about-inner">
				<!-- 【可修改】換成果園照片 -->
				<div class="img-placeholder">🌳</div>
				<div>
					<h2>我們的故事</h2>
					<p>我們是位於○○的家族果園，三代人守護這片柚子林已超過 50 年。</p>
					<p>堅持讓柚子在樹上自然熟成，採收後再經過「消水」靜置，讓果肉更加香甜。</p>
				</div>
			</div>
		</section>

		<!-- ===== 種植理念（可自行增減區塊） ===== -->
		<section>
			<div class="container about-inner">
				<div>
					<h2>我們的堅持</h2>
					<!-- 【可修改】種植方式、認證、得獎紀錄等 -->
					<p>在這裡介紹你的種植方式，例如施肥、疏果、採收時機等。</p>
					<p>也可以放上產銷履歷、有機認證或得獎紀錄。</p>
				</div>
				<!-- 【可修改】換成照片 -->
				<div class="img-placeholder">👨‍🌾</div>
			</div>
		</section>

		<!-- ===== 聯絡 / 訂購：內容由 main.js 產生，要修改請改 main.js ===== -->
		<section id="contact" class="contact"></section>
	</main>

	<!-- ===== 頁尾：內容由 main.js 產生，要修改請改 main.js ===== -->
	<footer class="site-footer" id="site-footer"></footer>

	<script src="main.js"></script>
