<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- 【可修改】網站標題與描述 -->
	<title>柚香園｜產地直送文旦柚</title>
	<meta name="description" content="自家果園產地直送，當季新鮮文旦柚、白柚、紅柚，宅配到府。">
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- ===== 導覽列：內容由 main.js 產生，要修改請改 main.js ===== -->
	<header class="site-header" id="site-header"></header>

	<main>
		<!-- ===== 主視覺 ===== -->
		<div class="hero">
			<div class="container hero-inner">
				<div>
					<!-- 【可修改】主標語 -->
					<h1>當季現採文旦柚<br>從果園直送你家</h1>
					<p>自家果園自然栽種，熟成才採收，每一顆都經過人工挑選，香甜多汁。</p>
					<div class="hero-actions">
						<a href="product.html" class="btn">立即選購</a>
						<a href="about.html" class="btn btn-outline">認識果園</a>
					</div>
				</div>
				<!-- 【可修改】換成主視覺照片：<img src="images/hero.jpg" alt="新鮮文旦柚"> -->
				<div class="img-placeholder">🍈</div>
			</div>
		</div>

		<!-- ===== 特色 ===== -->
		<section id="features">
			<div class="container">
				<h2 class="section-title">為什麼選擇我們</h2>
				<p class="section-subtitle">用心種好柚，安心吃得到</p>
				<div class="features">
					<!-- 【可修改】增減 .feature 區塊即可 -->
					<div class="feature">
						<div class="feature-icon">🌱</div>
						<h3>友善種植</h3>
						<p>減少農藥使用，讓柚子自然生長。</p>
					</div>
					<div class="feature">
						<div class="feature-icon">🚚</div>
						<h3>產地直送</h3>
						<p>採收後直接出貨，保留最新鮮的風味。</p>
					</div>
					<div class="feature">
						<div class="feature-icon">✋</div>
						<h3>人工挑選</h3>
						<p>每顆柚子都經過檢查，外觀與甜度有保障。</p>
					</div>
					<div class="feature">
						<div class="feature-icon">🎁</div>
						<h3>精美禮盒</h3>
						<p>中秋送禮首選，提供禮盒包裝服務。</p>
					</div>
				</div>
			</div>
		</section>

		

		<!-- ===== 聯絡 / 訂購：內容由 main.js 產生，要修改請改 main.js ===== -->
		<section id="contact" class="contact"></section>
	</main>

	<!-- ===== 頁尾：內容由 main.js 產生，要修改請改 main.js ===== -->
	<footer class="site-footer" id="site-footer"></footer>

	<script src="main.js"></script>
</body>
</html>
