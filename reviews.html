<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>顧客評價｜柚香園</title>
	<meta name="description" content="看看吃過柚香園柚子的顧客怎麼說。">
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- ===== 導覽列：內容由 main.js 產生，要修改請改 main.js ===== -->
	<header class="site-header" id="site-header"></header>

	<main>
		<!-- ===== 頁面標題 ===== -->
		<div class="page-banner">
			<div class="container">
				<h1>顧客怎麼說</h1>
				<p>感謝每一位回購的朋友</p>
			</div>
		</div>

		<!-- ===== 評價列表 ===== -->
		<section id="reviews">
			<div class="container">
				<div class="reviews">
					<!-- 【可修改】換成真實顧客評價，複製 .review 區塊即可新增 -->
					<div class="review">
						<p>「評價內容範例，請替換成真實的顧客回饋。」</p>
						<div class="review-name">— 顧客 A</div>
					</div>
					<div class="review">
						<p>「評價內容範例，請替換成真實的顧客回饋。」</p>
						<div class="review-name">— 顧客 B</div>
					</div>
					<div class="review">
						<p>「評價內容範例，請替換成真實的顧客回饋。」</p>
						<div class="review-name">— 顧客 C</div>
					</div>
				</div>
			</div>
		</section>

		<!-- ===== 聯絡 / 訂購：內容由 main.js 產生，要修改請改 main.js ===== -->
		<section id="contact" class="contact"></section>
	</main>

	<!-- ===== 頁尾：內容由 main.js 產生，要修改請改 main.js ===== -->
	<footer class="site-footer" id="site-footer"></footer>

	<script src="main.js"></script>
</body>
</html>
