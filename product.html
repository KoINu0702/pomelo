<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>當季商品｜柚香園</title>
	<meta name="description" content="柚香園當季商品：文旦柚、紅柚、中秋精選禮盒。">
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<!-- ===== 導覽列：內容由 main.js 產生，要修改請改 main.js ===== -->
	<header class="site-header" id="site-header"></header>

	<main>
		<!-- ===== 頁面標題 ===== -->
		<div class="page-banner">
			<div class="container">
				<h1>當季商品</h1>
				<p>數量有限，售完為止</p>
			</div>
		</div>

		<!-- ===== 商品 ===== -->
		<section id="products">
			<div class="container">
				<div class="products">
					<!-- 【可修改】複製一整個 .product 區塊就能新增商品 -->
					<div class="product">
						<div class="img-placeholder">🍈</div>
						<div class="product-body">
							<h3>文旦柚 10 斤裝</h3>
							<p>果肉細緻、酸甜適中，中秋必備。</p>
							<div class="product-price">NT$ 680 <small>/ 箱</small></div>
							<a href="#contact" class="btn">我要訂購</a>
						</div>
					</div>
					<div class="product">
						<div class="img-placeholder">🍊</div>
						<div class="product-body">
							<h3>紅柚 10 斤裝</h3>
							<p>果肉粉紅、水分充足，口感清爽。</p>
							<div class="product-price">NT$ 780 <small>/ 箱</small></div>
							<a href="#contact" class="btn">我要訂購</a>
						</div>
					</div>
					<div class="product">
						<div class="img-placeholder">🎁</div>
						<div class="product-body">
							<h3>中秋精選禮盒</h3>
							<p>精選大顆文旦 6 入，附提袋與賀卡。</p>
							<div class="product-price">NT$ 980 <small>/ 盒</small></div>
							<a href="#contact" class="btn">我要訂購</a>
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- ===== 聯絡 / 訂購：內容由 main.js 產生，要修改請改 main.js ===== -->
		<section id="contact" class="contact"></section>
	</main>

	<!-- ===== 頁尾：內容由 main.js 產生，要修改請改 main.js ===== -->
	<footer class="site-footer" id="site-footer"></footer>

	<script src="main.js"></script>
</body>
</html>
